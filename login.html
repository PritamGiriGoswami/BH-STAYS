<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Account | BH Stays</title>
  <link rel="icon" type="image/x-icon" href="image/logo.jfif">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="s2.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.15) 0%, rgba(11, 15, 25, 0.98) 75%),
                  url('image/pexels-nudos-adicora-11448497.jpg') center/cover no-repeat;
    }
    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 450px;
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .auth-tabs {
      display: flex;
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      padding: 0.25rem;
      margin-bottom: 1.5rem;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 0.65rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      background: transparent;
    }
    .auth-tab-btn.active {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }
    .form-group {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .input-with-icon {
      position: relative;
    }
    .input-with-icon i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }
    .input-with-icon input {
      padding-left: 2.75rem;
    }
    .social-auth {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .btn-social {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.65rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-social:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
  </style>
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-house-chimney-window"></i></div>
        <span>BH Stays</span>
      </a>

      <ul class="nav-menu">
        <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="aboutus.html" class="nav-link"><i class="fa-solid fa-circle-info"></i> About Us</a></li>
      </ul>

      <div class="nav-actions">
        <a href="index.html" class="btn-auth"><i class="fa-solid fa-arrow-left"></i> Back to Stays</a>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome to <span>BH Stays</span></h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Sign in to access secret member deals & manage reservations.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" onsubmit="handleAuthSubmit(event, 'sign in')">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" class="search-input" placeholder="guest@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="search-input" placeholder="••••••••" required>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; font-size:0.85rem;">
          <label style="display:flex; align-items:center; gap:0.5rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" style="color:var(--accent-gold);">Forgot password?</a>
        </div>

        <button type="submit" class="btn-search" style="width:100%;">Sign In</button>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signup-form" style="display:none;" onsubmit="handleAuthSubmit(event, 'account creation')">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" class="search-input" placeholder="Jane Doe" required>
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" class="search-input" placeholder="jane@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" class="search-input" placeholder="Create a strong password" required>
          </div>
        </div>

        <button type="submit" class="btn-search" style="width:100%; margin-top:1rem;">Register Now</button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; color:var(--text-dim); font-size:0.8rem;">
        OR CONTINUE WITH
      </div>

      <div class="social-auth">
        <button class="btn-social" onclick="showToast('Google Sign-in initialized', 'fa-google')">
          <i class="fa-brands fa-google" style="color:#ea4335;"></i> Google
        </button>
        <button class="btn-social" onclick="showToast('Apple Sign-in initialized', 'fa-apple')">
          <i class="fa-brands fa-apple"></i> Apple
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function switchAuthTab(tab) {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');

      if (tab === 'login') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabSignup.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        tabSignup.classList.add('active');
        tabLogin.classList.remove('active');
      }
    }

    function handleAuthSubmit(e, actionName) {
      e.preventDefault();
      showToast(`Successful ${actionName}! Redirecting to stays...`, 'fa-circle-check');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }
  </script>
</body>
</html>
